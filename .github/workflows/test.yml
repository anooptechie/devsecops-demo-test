name: Push Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Print message
        run: echo "🎉 Push trigger is working!"

      - name: Print GitHub event
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Print branch
        run: echo "Branch is ${{ github.ref }}"
